<script>
    //Solicite dois números ao usuario e retorne as 4 operações basicas da matematica(soma,subtração,adição,multiplicação) come resultado na página
    const n1=Number(window.prompt('DIgite um número:'))
    const n2=Number(window.prompt('DIgite outro número:'))
    const soma= n1+n2
    const sub= n1-n2
    const mult= n1*n2
    const div= n1/n2
    document.write(`A soma de ${n1}+${n2} é igual a: ${soma} <br>`)
    document.write(`A subtração de ${n1}-${n2} é igual a: ${sub}<br>`)
    document.write(`A divisão de ${n1} por ${n2} é igual a: ${div}<br>`)
    document.write(`A multiplicação de ${n1} por ${n2} é igual a: ${mult}`)    
</script>
